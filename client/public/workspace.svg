  <path d="M363 164 v74 M336 238 h54" stroke="#c9c9c2" stroke-width="8" stroke-linecap="round"/>
  <!-- keyboard -->
  <rect x="128" y="216" width="150" height="16" rx="4" fill="#f7f7f4" stroke="#d3d3cc"/>

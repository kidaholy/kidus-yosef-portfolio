    <path d="M126 80 h84 M156 96 h76 M116 112 h60 M66 128 h130 M66 144 h96 M66 160 h60"/>
  </g>
  <!-- monitor 2 -->
  <rect x="272" y="52" width="182" height="112" rx="8" fill="url(#scr)" stroke="#d8d8d2"/>
  <g stroke="#c4c4bd" stroke-width="2" opacity="0.9">
    <path d="M288 76 h140 M288 92 h112 M288 108 h128 M288 124 h84"/>
  </g>
  <circle cx="418" cy="140" r="8" fill="#ff5c1a"/>
  <!-- desk -->

  </defs>
  <rect width="500" height="390" rx="10" fill="url(#wbg)"/>
  <!-- monitor 1 -->
  <rect x="46" y="52" width="212" height="140" rx="8" fill="url(#scr)" stroke="#d8d8d2"/>
  <g stroke="#ff5c1a" stroke-width="2.5" opacity="0.9">
    <path d="M66 80 h44 M66 96 h70 M66 112 h36"/>
  </g>

      <stop offset="0" stop-color="#f4f4f1"/>
      <stop offset="1" stop-color="#e9e9e5"/>
    </linearGradient>
    <linearGradient id="scr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f1ee"/>

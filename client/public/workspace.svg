  <rect x="424" y="196" width="22" height="28" rx="4" fill="#ffffff" stroke="#d3d3cc"/>
  <path d="M446 202 q14 4 0 16" stroke="#d3d3cc" stroke-width="5" fill="none"/>
  <!-- hands -->
  <ellipse cx="160" cy="300" rx="40" ry="24" fill="#3a3a3a"/>
  <ellipse cx="252" cy="312" rx="44" ry="26" fill="#333333"/>
  <!-- phone -->

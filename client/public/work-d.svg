    <rect x="268" y="158" width="70" height="8" rx="3"/>
  </g>
  <rect x="268" y="180" width="132" height="20" rx="5" fill="#ff5c1a"/>
  <g fill="#c9c9c2">
    <rect x="268" y="212" width="42" height="12" rx="3"/>
    <rect x="318" y="212" width="42" height="12" rx="3"/>
    <rect x="368" y="212" width="32" height="12" rx="3"/>
  </g>
  <!-- medicine bottles -->
  <rect x="88" y="150" width="46" height="92" rx="8" fill="#ffffff" stroke="#d8d8d2"/>
  <rect x="98" y="132" width="26" height="22" rx="4" fill="#e6e6e1"/>

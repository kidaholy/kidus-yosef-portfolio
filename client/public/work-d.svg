  </defs>
  <rect width="480" height="320" fill="url(#d)"/>
  <!-- POS terminal -->
  <rect x="252" y="60" width="164" height="180" rx="10" fill="#ffffff" stroke="#d8d8d2"/>
  <rect x="268" y="76" width="132" height="54" rx="6" fill="#f4f4f1"/>
  <path d="M278 108 l16 -12 l14 8 l18 -16" stroke="#ff5c1a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <g fill="#dedeD8">
